# Local commit-time checks (QUAL-003).
#
# Install once with:  pre-commit install
# Run on demand with: pre-commit run --all-files
#
# Policy: hooks here only CHECK, never rewrite files. Auto-fixers are run
# deliberately (`ruff check --fix`) so a commit never changes content the
# author didn't review. CI remains the authoritative gate; these hooks just
# catch the obvious failures before a push.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev aligned with the ruff pin in constraints.txt. This is not a
    # convention any more: test_supply_chain_policy.py enforces it, because the
    # two drifted (v0.15.1 vs ruff==0.16.3) and the hook spent a release linting
    # with different rules than CI.
    rev: v0.16.3
    hooks:
      - id: ruff
        name: ruff check (no fixes)
        # Match the repository paths checked by Ruff in GitHub Actions.
        files: ^(app\.py|backend/|screeners/|ui/|Dependencies/|tests/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: debug-statements
